<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Kamu 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="curtain" onclick="openCurtain()">
        <div class="curtain-panel left">🌷</div>
        <div class="curtain-panel right">🌷</div>
        <div class="curtain-text">Sentuh Layar untuk Membuka ya Cantik✨</div>
    </div>

    <audio id="myAudio" loop>
        <source src="lagu.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung pemutar audio.
    </audio>

    <div class="container">
        <div class="card">
            <div class="tulip-header">🌷🩵🌷</div>
            <h1>Hai Cayangggg!</h1>
            <p class="subtitle">Semangat ya lanjutin tugas sekolahnya hari ini!</p>
            
            <hr class="divider">

            <div class="message">
                <p>Nanti pas istirahat makan siang, aku mau nemenin kamu ke sekolah yak. Abis urusan tugas kelar, kita main duluu sampai istirahat kelar ya! </p>
            </div>

            <div class="audio-control">
                <button onclick="toggleAudio()" id="musicBtn">🎵 Jeda Lagu</button>
            </div>

            <div class="footer">
                <p>Dibuat khusus buat kamu yang paling spesial ✨</p>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('myAudio');
        const curtain = document.getElementById('curtain');
        const musicBtn = document.getElementById('musicBtn');

        function openCurtain() {
            curtain.classList.add('open');
            // Memutar lagu secara otomatis saat tirai dibuka
            audio.play().catch(error => {
                console.log("Autoplay dibatasi browser:", error);
            });
            setTimeout(() => {
                curtain.style.display = 'none';
            }, 1200);
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicBtn.innerHTML = "🎵 Jeda Lagu";
            } else {
                audio.pause();
                musicBtn.innerHTML = "🎶 Putar Lagu";
            }
        }
    </script>
</body>
</html>
